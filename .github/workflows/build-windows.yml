name: Build Windows Application Installer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Executable & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pyinstaller pywebview pythonnet pywin32 bottle aiohttp pyserial multidict yarl frozenlist aiosignal

      - name: Run Windows Build Script
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python build_windows.py

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Compile Installer (.exe)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload Standalone App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JRT-Tech-ANALIST-Pro-Windows-Folder
          path: dist/JRT Tech ANALIST Pro

      - name: Upload Installer Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JRT_Tech_ANALIST_Pro_v3.4_Setup.exe
          path: Output/JRT_Tech_ANALIST_Pro_v3.4_Setup.exe

  build-csharp:
    name: Build Native C# Windows Executable (~3MB)
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build C# WinForms Application (.exe)
        run: |
          msbuild kline_diagnose_ref/KLine_Diagnose_Motorcycle.csproj -p:Configuration=Release -p:Platform="AnyCPU"

      - name: Build C# WPF ANALIST Pro Application (.exe)
        run: |
          dotnet publish JRT-Tect-Studio-Pro/src/JRT.Tect.Desktop/JRT.Tect.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true


      - name: Upload Native C# Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JRT-Tech-ANALIST-Pro-Native-CSharp-Exe
          path: |
            JRT-Tect-Studio-Pro/src/JRT.Tect.Desktop/bin/Release/net6.0-windows/win-x64/publish/JRT_Tech_ANALIST_Pro_Native.exe
            kline_diagnose_ref/bin/Release/KLine_Diagnose_Motorcycle.exe
            kline_diagnose_ref/bin/Release/*.dll


