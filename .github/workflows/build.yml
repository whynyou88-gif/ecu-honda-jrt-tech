name: JRT Tech ANALIST Pro - Official Release Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-admin-keygen:
    name: Build Admin Keygen Studio (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            out-keygen: 'JRT_Tech_Admin_Keygen_Studio.exe'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            out-keygen: 'JRT_Tech_Admin_Keygen_Studio_macOS'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'jrt-tech-native -> target'

      - name: Build Admin Keygen Binary
        run: |
          cd jrt-tech-native
          cargo build --release --target ${{ matrix.target }} --bin jrt-keygen-gui

      - name: Prepare Keygen Artifact
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            cp jrt-tech-native/target/${{ matrix.target }}/release/jrt-keygen-gui.exe ./${{ matrix.out-keygen }}
          else
            cp jrt-tech-native/target/${{ matrix.target }}/release/jrt-keygen-gui ./${{ matrix.out-keygen }}
          fi

      - name: Upload Admin Keygen Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out-keygen }}
          path: ${{ matrix.out-keygen }}

      - name: Upload Keygen Release Asset (on Tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.out-keygen }}
          tag_name: ${{ github.ref_name }}
          name: 'JRT Tech ANALIST Pro ${{ github.ref_name }}'
          body: 'Official 100% exact release build for JRT Tech ANALIST Pro.'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-main-app:
    name: Build Main App Installer & Portable Folder (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
            target: 'x86_64-pc-windows-msvc'
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
            target: 'universal-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'jrt-tech-tauri/package-lock.json'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'jrt-tech-tauri/src-tauri -> target'

      - name: Install Frontend Dependencies
        run: |
          cd jrt-tech-tauri
          npm install

      - name: Build Main Application Installer & Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: 'jrt-tech-tauri'
          tagName: ${{ github.ref_name }}
          releaseName: 'JRT Tech ANALIST Pro ${{ github.ref_name }}'
          releaseBody: 'Official release build containing 100% exact original UI and fast Rust backend.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Create Complete Portable Software Folder (ZIP Archive)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p JRT_Tech_ANALIST_Pro_v3.4.0_Portable_Folder
          cp jrt-tech-tauri/src-tauri/target/release/jrt-tech-analist-pro.exe JRT_Tech_ANALIST_Pro_v3.4.0_Portable_Folder/JRT_Tech_ANALIST_Pro.exe || true
          cp EULA_LICENSE.txt JRT_Tech_ANALIST_Pro_v3.4.0_Portable_Folder/
          cp README_CARA_AKTIVASI.txt JRT_Tech_ANALIST_Pro_v3.4.0_Portable_Folder/
          cp HondaECUTool/data/web/hondalogo.png JRT_Tech_ANALIST_Pro_v3.4.0_Portable_Folder/
          cp HondaECUTool/data/web/logo-racing.png JRT_Tech_ANALIST_Pro_v3.4.0_Portable_Folder/
          cp jrt-tech-native/icon.ico JRT_Tech_ANALIST_Pro_v3.4.0_Portable_Folder/ || true
          7z a -tzip JRT_Tech_ANALIST_Pro_v3.4.0_Portable_Folder.zip ./JRT_Tech_ANALIST_Pro_v3.4.0_Portable_Folder/*

      - name: Upload Portable Folder ZIP Asset (on Tag push)
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: JRT_Tech_ANALIST_Pro_v3.4.0_Portable_Folder.zip
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
