name: JRT Tech ANALIST Pro - Pure Native Slint & Tauri Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-slint-native:
    name: Build Pure Native Slint (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            binary-name: 'jrt-tech-native.exe'
            out-name: 'jrt-tech-native-windows-x64.exe'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            binary-name: 'jrt-tech-native'
            out-name: 'jrt-tech-native-macos-arm64'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'jrt-tech-native -> target'

      - name: Build Slint Native Release Binary
        run: |
          cd jrt-tech-native
          cargo build --release --target ${{ matrix.target }}

      - name: Prepare Artifact
        shell: bash
        run: |
          cd jrt-tech-native
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/jrt-tech-native.exe ../${{ matrix.out-name }}
          else
            cp target/${{ matrix.target }}/release/jrt-tech-native ../${{ matrix.out-name }}
          fi

      - name: Upload Slint Native Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out-name }}
          path: ${{ matrix.out-name }}

      - name: Create / Upload GitHub Release Asset (on Tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.out-name }}
          tag_name: ${{ github.ref_name }}
          name: 'JRT Tech ANALIST Pro ${{ github.ref_name }}'
          body: 'Automated release build containing Pure Native Slint executable and Tauri installer.'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-tauri:
    name: Build Tauri Bundle (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
            target: 'x86_64-pc-windows-msvc'
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
            target: 'universal-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'jrt-tech-tauri/package-lock.json'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'jrt-tech-tauri/src-tauri -> target'

      - name: Install Frontend Dependencies
        run: |
          cd jrt-tech-tauri
          npm install

      - name: Build Tauri Application & Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: 'jrt-tech-tauri'
          tagName: ${{ github.ref_name }}
          releaseName: 'JRT Tech ANALIST Pro ${{ github.ref_name }}'
          releaseBody: 'Automated release build for JRT Tech ANALIST Pro 3.4'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
