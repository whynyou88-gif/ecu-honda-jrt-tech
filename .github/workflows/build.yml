name: JRT Tech ANALIST Pro - Setup Installer Release Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-admin-keygen:
    name: Build Admin Keygen Studio (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            out-keygen: 'JRT_Tech_Admin_Keygen_Studio.exe'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            out-keygen: 'JRT_Tech_Admin_Keygen_Studio_macOS'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'jrt-tech-native -> target'

      - name: Build Admin Keygen Binary
        run: |
          cd jrt-tech-native
          cargo build --release --target ${{ matrix.target }} --bin jrt-keygen-gui

      - name: Prepare Keygen Artifact
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            cp jrt-tech-native/target/${{ matrix.target }}/release/jrt-keygen-gui.exe ./${{ matrix.out-keygen }}
          else
            cp jrt-tech-native/target/${{ matrix.target }}/release/jrt-keygen-gui ./${{ matrix.out-keygen }}
          fi

      - name: Upload Admin Keygen Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out-keygen }}
          path: ${{ matrix.out-keygen }}

      - name: Upload Keygen Release Asset (on Tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.out-keygen }}
          tag_name: ${{ github.ref_name }}
          name: 'JRT Tech ANALIST Pro ${{ github.ref_name }}'
          body: 'Official 100% exact release build for JRT Tech ANALIST Pro.'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-main-setup-installer:
    name: Build Setup Wizard Installer (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
            target: 'x86_64-pc-windows-msvc'
            out-setup: 'JRT_Tech_ANALIST_Pro_v3.4.0_Windows_Setup.exe'
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
            target: 'universal-apple-darwin'
            out-setup: 'JRT_Tech_ANALIST_Pro_v3.4.0_macOS.dmg'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'jrt-tech-tauri/package-lock.json'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'jrt-tech-tauri/src-tauri -> target'

      - name: Install Frontend Dependencies
        run: |
          cd jrt-tech-tauri
          npm install

      - name: Build Setup Wizard Installer & Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: 'jrt-tech-tauri'
          tagName: ${{ github.ref_name }}
          releaseName: 'JRT Tech ANALIST Pro ${{ github.ref_name }}'
          releaseBody: 'Official release build containing 100% exact original UI, NSIS Setup Wizard Installer, and fast Rust backend.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Rename & Upload Main Setup Installer (on Tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            SETUP_FILE=$(find jrt-tech-tauri/src-tauri/target/release/bundle/nsis -name "*.exe" | head -n 1)
            if [ -n "$SETUP_FILE" ]; then
              cp "$SETUP_FILE" ./${{ matrix.out-setup }}
              gh release upload ${{ github.ref_name }} ./${{ matrix.out-setup }} --clobber
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
