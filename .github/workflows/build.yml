name: JRT Tech ANALIST Pro - Native Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
            target: 'x86_64-pc-windows-msvc'
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
            target: 'universal-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'jrt-tech-tauri/package-lock.json'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'jrt-tech-tauri/src-tauri -> target'

      - name: Install Dependencies for Ubuntu / Linux (if added)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev

      - name: Install Frontend Dependencies
        run: |
          cd jrt-tech-tauri
          npm install

      # ============================================================
      # TODO: CODE SIGNING & NOTARIZATION CONFIGURATION
      # ============================================================
      # 1. WINDOWS CODE SIGNING (prevents SmartScreen "Unknown Publisher"):
      #    - Obtain EV or OV Code Signing Certificate (.pfx / .p12)
      #    - Add repository secrets: WIN_CSC_LINK (base64 cert) & WIN_CSC_KEYPASS (password)
      #    - Pass environment variables to tauri-action step below:
      #        env:
      #          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
      #          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
      #
      # 2. MACOS NOTARIZATION (prevents Apple Gatekeeper "app is damaged" error):
      #    - Requires active Apple Developer Account ($99/year)
      #    - Export Developer ID Application Certificate & Apple ID App-Specific Password
      #    - Pass environment variables to tauri-action step:
      #        env:
      #          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      #          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      #          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      #          APPLE_ID: ${{ secrets.APPLE_ID }}
      #          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      #          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # ============================================================

      - name: Build Tauri Application & Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: 'jrt-tech-tauri'
          tagName: ${{ github.ref_name }}
          releaseName: 'JRT Tech ANALIST Pro ${{ github.ref_name }}'
          releaseBody: 'Automated release build for JRT Tech ANALIST Pro 3.4'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Build Artifacts (Branch push or manual dispatch)
        if: !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: jrt-tech-${{ matrix.platform }}
          path: |
            jrt-tech-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            jrt-tech-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            jrt-tech-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            jrt-tech-tauri/src-tauri/target/release/bundle/msi/*.msi
            jrt-tech-tauri/src-tauri/target/release/bundle/nsis/*.exe
            jrt-tech-tauri/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
