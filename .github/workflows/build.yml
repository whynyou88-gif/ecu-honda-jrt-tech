name: JRT Tech ANALIST Pro - Production Build & Release Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    name: Build Windows Installer (PyInstaller Onedir + Inno Setup)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Onedir Bundle with PyInstaller
        run: |
          pyinstaller analist_pro.spec --clean

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build Installer with Inno Setup
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          $setupFile = Get-ChildItem "Output\*.exe" | Select-Object -First 1
          if ($setupFile) {
            $setupSize = $setupFile.Length / 1MB
            Write-Host "✅ Installer built: $($setupFile.Name)"
            Write-Host "   Installer size: $([math]::Round($setupSize, 1)) MB"
          } else {
            Write-Error "❌ Installer not found in Output/"
            exit 1
          }

      - name: Upload Setup Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JRT_Tech_ANALIST_Pro_v3.4_Setup
          path: Output/JRT_Tech_ANALIST_Pro_v3.4_Setup.exe

      - name: Create GitHub Release (on Tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/JRT_Tech_ANALIST_Pro_v3.4_Setup.exe
          tag_name: ${{ github.ref_name }}
          name: 'JRT Tech ANALIST Pro ${{ github.ref_name }}'
          body: |
            ## JRT Tech ANALIST Pro ${{ github.ref_name }} — Windows Desktop Installer

            Software Diagnostic & Remapping ECU Honda Matic — 100% Exact Web Frontend

            ### 🚀 Key Optimizations:
            - **100% Identical Visual UI & Functionality**: Exact HTML/CSS/JS interface as macOS version.
            - **Optimized Onedir Build**: No temporary file extraction delay on startup (< 2s load time).
            - **Clean Windows Installer**: Created with Inno Setup for easy installation without UAC prompts.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
