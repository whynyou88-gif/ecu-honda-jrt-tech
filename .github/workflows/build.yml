name: JRT Tech ANALIST Pro - PyInstaller + Inno Setup Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    name: Build Windows Installer (PyInstaller Onedir + Inno Setup)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller (Onedir)
        run: |
          echo "::group::PyInstaller Build"
          pyinstaller analist_pro.spec --clean --noconfirm
          echo "::endgroup::"

      - name: Verify Build Output
        shell: pwsh
        run: |
          $exePath = "dist\JRT Tech ANALIST Pro\JRT Tech ANALIST Pro.exe"
          if (Test-Path $exePath) {
            $exeSize = (Get-Item $exePath).Length / 1MB
            $totalSize = (Get-ChildItem "dist\JRT Tech ANALIST Pro" -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
            Write-Host "✅ EXE found: $exePath"
            Write-Host "   EXE size: $([math]::Round($exeSize, 1)) MB"
            Write-Host "   Total folder size: $([math]::Round($totalSize, 1)) MB"
          } else {
            Write-Error "❌ EXE not found at $exePath"
            exit 1
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build Installer with Inno Setup
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          $setupFile = Get-ChildItem "Output\*.exe" | Select-Object -First 1
          if ($setupFile) {
            $setupSize = $setupFile.Length / 1MB
            Write-Host "✅ Installer built: $($setupFile.Name)"
            Write-Host "   Installer size: $([math]::Round($setupSize, 1)) MB"
          } else {
            Write-Error "❌ Installer not found in Output/"
            exit 1
          }

      - name: Upload Setup Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JRT_Tech_ANALIST_Pro_v3.4_Setup
          path: Output/JRT_Tech_ANALIST_Pro_v3.4_Setup.exe

      - name: Create GitHub Release (on Tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/JRT_Tech_ANALIST_Pro_v3.4_Setup.exe
          tag_name: ${{ github.ref_name }}
          name: 'JRT Tech ANALIST Pro ${{ github.ref_name }}'
          body: |
            ## JRT Tech ANALIST Pro ${{ github.ref_name }}

            Honda ECU Remap & Diagnostic Studio — Windows Setup Installer

            ### Installation
            1. Download `JRT_Tech_ANALIST_Pro_v3.4_Setup.exe`
            2. Run installer — no admin required (installs to user folder)
            3. Application launches automatically after installation

            ### Features
            - K-Line ECU Diagnostic & DTC Reader
            - Flash Read/Write with automatic backup
            - Real-time Live Data monitoring
            - Multi-brand support (Honda, Kawasaki, Suzuki, Yamaha)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-admin-keygen:
    name: Build Admin Keygen Studio (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'jrt-tech-native -> target'

      - name: Build Admin Keygen Binary
        run: |
          cd jrt-tech-native
          cargo build --release --bin jrt-keygen-gui

      - name: Upload Admin Keygen Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JRT_Tech_Admin_Keygen_Studio
          path: jrt-tech-native/target/release/jrt-keygen-gui.exe

      - name: Upload Keygen Release Asset (on Tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cp jrt-tech-native/target/release/jrt-keygen-gui.exe ./JRT_Tech_Admin_Keygen_Studio.exe
          gh release upload ${{ github.ref_name }} ./JRT_Tech_Admin_Keygen_Studio.exe --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
