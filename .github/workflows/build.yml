name: JRT Tech ANALIST Pro - Native WPF (.NET 8) Release Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    name: Build Native WPF Installer (.NET 8 + Inno Setup)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test Core & Protocol Solution
        run: |
          dotnet test JRT-Tect-Studio-Pro/JRT-Tect-Studio-Pro.sln -c Release

      - name: Publish Standalone WPF Application
        run: |
          dotnet publish JRT-Tect-Studio-Pro/src/JRT.Tect.Desktop/JRT.Tect.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true -p:TieredPGO=true

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build Installer with Inno Setup
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          $setupFile = Get-ChildItem "Output\*.exe" | Select-Object -First 1
          if ($setupFile) {
            $setupSize = $setupFile.Length / 1MB
            Write-Host "✅ Installer built: $($setupFile.Name)"
            Write-Host "   Installer size: $([math]::Round($setupSize, 1)) MB"
          } else {
            Write-Error "❌ Installer not found in Output/"
            exit 1
          }

      - name: Upload Setup Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JRT_Tech_ANALIST_Pro_v3.4_Setup
          path: Output/JRT_Tech_ANALIST_Pro_v3.4_Setup.exe

      - name: Create GitHub Release (on Tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/JRT_Tech_ANALIST_Pro_v3.4_Setup.exe
          tag_name: ${{ github.ref_name }}
          name: 'JRT Tech ANALIST Pro ${{ github.ref_name }} (Native WPF .NET 8)'
          body: |
            ## JRT Tech ANALIST Pro ${{ github.ref_name }} — Native WPF (.NET 8)

            Professional Honda ECU Remap & Diagnostic Studio — High Performance WPF Desktop Edition

            ### 🚀 Key Improvements:
            - **100% Native C# WPF (.NET 8)** — Zero Python runtime overhead.
            - **Anti-Freeze Navigation** — Instantaneous tab switching (< 10ms) using View Caching.
            - **Async K-Line Protocol** — Non-blocking serial stream with `CancellationToken` and `IProgress<T>`.
            - **On-Demand SQLite Repository** — Ultra-fast memory footprint and instant startup (< 1.5s).
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
