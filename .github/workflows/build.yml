name: JRT Tech ANALIST Pro - Pure Native Slint & Tauri Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-slint-native:
    name: Build Pure Native Slint & Admin Keygen (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            out-setup: 'JRT_Tech_ANALIST_Pro_v3.4.0_Windows_Setup.exe'
            out-keygen: 'JRT_Tech_Admin_Keygen_Studio.exe'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            out-setup: 'JRT_Tech_ANALIST_Pro_v3.4.0_macOS.dmg'
            out-keygen: 'JRT_Tech_Admin_Keygen_Studio_macOS'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'jrt-tech-native -> target'

      - name: Build Slint Native Release Binaries (Main App + Keygen GUI)
        run: |
          cd jrt-tech-native
          cargo build --release --target ${{ matrix.target }} --bins

      - name: Create Professional Windows Setup Installer (Inno Setup)
        if: matrix.platform == 'windows-latest'
        shell: cmd
        run: |
          cd jrt-tech-native
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          cp target\${{ matrix.target }}\release\jrt-keygen-gui.exe ..\${{ matrix.out-keygen }}

      - name: Create macOS DMG Installer & Prepare Keygen
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          cd jrt-tech-native
          mkdir -p dmg_root
          cp target/${{ matrix.target }}/release/jrt-tech-native dmg_root/
          hdiutil create -volname "JRT Tech ANALIST Pro" -srcfolder dmg_root -ov -format UDZO ../JRT_Tech_ANALIST_Pro_v3.4.0_macOS.dmg
          cp target/${{ matrix.target }}/release/jrt-keygen-gui ../${{ matrix.out-keygen }}

      - name: Upload Slint Native Installers & Keygen Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-artifacts
          path: |
            ${{ matrix.out-setup }}
            ${{ matrix.out-keygen }}

      - name: Create / Upload GitHub Release Asset (on Tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.out-setup }}
            ${{ matrix.out-keygen }}
          tag_name: ${{ github.ref_name }}
          name: 'JRT Tech ANALIST Pro ${{ github.ref_name }}'
          body: 'Automated release build containing Pure Native Slint Setup Installer and Admin Keygen Studio GUI Application.'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-tauri:
    name: Build Tauri Bundle (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
            target: 'x86_64-pc-windows-msvc'
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
            target: 'universal-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'jrt-tech-tauri/package-lock.json'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'jrt-tech-tauri/src-tauri -> target'

      - name: Install Frontend Dependencies
        run: |
          cd jrt-tech-tauri
          npm install

      - name: Build Tauri Application & Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: 'jrt-tech-tauri'
          tagName: ${{ github.ref_name }}
          releaseName: 'JRT Tech ANALIST Pro ${{ github.ref_name }}'
          releaseBody: 'Automated release build for JRT Tech ANALIST Pro 3.4'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
