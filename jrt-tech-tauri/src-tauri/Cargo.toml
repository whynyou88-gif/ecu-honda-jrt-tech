[package]
name = "jrt-tech-analist-pro"
version = "3.4.0"
description = "JRT Tech ANALIST Pro 3.4 - Honda ECU Remap Studio"
authors = ["Ferdy Valentino"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
md5 = "0.7"
crc32fast = "1"
chrono = "0.4"
glob = "0.3"
hex = "0.4"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
