[package]
name = "jrt-tech-native"
version = "3.4.0"
description = "JRT Tech ANALIST Pro 3.4 - Pure Native Honda ECU Remap Studio (Slint GUI)"
authors = ["Ferdy Valentino"]
edition = "2021"

[build-dependencies]
slint-build = "1.8"

[dependencies]
slint = "1.8"
serialport = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
md-5 = "0.10"
crc32fast = "1"
glob = "0.3"
log = "0.4"
env_logger = "0.11"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"

[[bin]]
name = "jrt-tech-native"
path = "src/main.rs"

[[bin]]
name = "jrt-keygen-gui"
path = "src/bin/keygen.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
